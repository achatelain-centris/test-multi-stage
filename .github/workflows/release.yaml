on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Release
        run: |
          echo "Releasing version ${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
          echo "Released version ${{ github.event.inputs.version }}"
          gh release create .github/workflows/* "v${{ github.event.inputs.version }}" --title "v${{ github.event.inputs.version }}" --notes "Release version ${{ github.event.inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


