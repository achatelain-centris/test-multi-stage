on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  env1:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy
        run: echo "Deploying application..."

  env2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy
        run: echo "Deploying application..."

  env3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy
        run: echo "Deploying application..."

  env4:
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - env1
      - env2
      - env3
    if: >-
      always() &&
      (
        needs.env1.result == 'success' ||
        needs.env2.result == 'success' ||
        needs.env3.result == 'success'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy
        run: echo "Deploying application..."
